# cameras.example.yaml — commit this, NOT cameras.yaml
# Copy this file to cameras.yaml and fill in your camera details.
#
# MJPEG path is auto-derived from path_sub by replacing subtype=1 → subtype=2.
# If your camera uses a different MJPEG path, update _build_url() in nvr.py.
#
# zone: is managed by the web UI (http://host:5000) — do not edit manually.

cameras:
  cam_1:
    ip: 192.168.1.XXX
    user: admin
    pass: YOUR_PASSWORD
    port: 554
    path_sub: /cam/realmonitor?channel=1&subtype=1
    threshold_pct: 30
    zone: []

  cam_2:
    ip: 192.168.1.XXX
    user: admin
    pass: YOUR_PASSWORD
    port: 554
    path_sub: /cam/realmonitor?channel=1&subtype=1
    threshold_pct: 30
    zone: []

